<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Janah Mart</title><link rel="icon" href="ikon-janah-mart.png"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--dark:#0A5840;--green:#12754F;--gold:#C69D46;--bg:#EEF4F0;--ink:#0F2A20;--mut:#5B7266;--line:#D5E3DA;--jm-green-900:#0A5840;--jm-green-700:#12754F;--jm-green-500:#1E8A5F;--jm-gold:#C69D46;--jm-cream:#F3F8F4;--jm-ink:#0F2A20;--surface:#fff;--muted:#5B7266;--font-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;--font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body)}
html,body{max-width:100%;overflow-x:hidden}@supports (overflow:clip){html,body{overflow-x:clip}}
.app{padding-bottom:96px;min-height:100%}
h1,h2,.hdg,.h{font-family:var(--font-display);font-weight:800}
h2{font-size:22px;margin:14px 0 10px}
.wrap{max-width:560px;margin:0 auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top img{display:block}
.hi small{color:var(--mut);display:block}.hi b{font:800 20px var(--font-display)}
.ask{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center;margin:14px 0}
.ic{background:var(--green);width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.ask b{font:800 18px var(--font-display);display:block}.ask span{color:var(--mut)}
.mem{background:var(--dark);color:#fff;border-radius:20px;padding:18px;margin:14px 0}
.mem b{font:800 20px var(--font-display);display:block}.mem>span{color:#bcd9ca}
.pill{display:inline-block;border:2px solid #3a8a6c;border-radius:999px;padding:3px 14px;margin:10px 8px 0 0;font:700 13px var(--font-display);color:#fff}
.pill.on{background:var(--gold);border-color:var(--gold);color:var(--dark)}
input,textarea{width:100%;padding:13px;margin:6px 0;border:2px solid var(--line);border-radius:14px;font:inherit;color:var(--ink);background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px 0 12px}
.cat{flex:none;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;font:600 14px var(--font-body)}
.cat.on{background:var(--dark);border-color:var(--dark);color:#fff}
.pc,.oc{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.oc{display:block}.oh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.em{font-size:34px}.pi{flex:1}.pi b{display:block}.pi span{color:var(--mut);font-size:14px}.pi i{display:block;font:800 15px var(--font-display);font-style:normal;color:var(--green)}
.add,.btn{background:var(--green);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:700 14px var(--font-display)}
.btn{width:100%;padding:14px;font-size:16px;margin-top:8px}
.qty{display:flex;align-items:center;background:var(--dark);color:#fff;border-radius:12px}.qty button{background:none;border:0;color:#fff;font-size:22px;width:38px;height:38px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:11px 14px;margin:6px 0;font:600 15px var(--font-body)}
.opt.on{border-color:var(--green);background:#e8f3ed}.opt.off{opacity:.55}
.st{border-radius:999px;padding:2px 12px;font:700 12px var(--font-display);background:#fff1c9}.st.selesai{background:#c8f2d6}.st.batal{background:#fcd2d2}.st.diantar,.st.diproses,.st.siap{background:#d4ebe0}
.link{background:none;border:0;color:var(--green);font:600 15px var(--font-body);padding:6px 0}
.msg{color:#b3261e;min-height:22px}.empty{color:var(--mut);text-align:center;padding:30px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--mut);font:600 13px var(--font-body);display:grid;gap:2px;justify-items:center}nav button.on{color:var(--green)}
nav .fab{background:var(--gold);color:var(--dark);width:60px;height:60px;border-radius:20px;font:800 24px var(--font-display);margin-top:-26px;box-shadow:0 6px 18px rgba(197,158,73,.45);display:block}
.sheet{position:fixed;inset:0;background:rgba(11,86,63,.5);z-index:9;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.auth{max-width:400px;margin:0 auto;padding:40px 20px}.auth h1{font-size:28px;margin:10px 0}
.hint{color:var(--mut);font-size:14px;margin:4px 0}.hint a{color:var(--green)}.mem .add{margin-right:8px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ph{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none;background:#e3eee6;display:block}.em.ph{display:grid;place-items:center;font-size:32px}
.st.ditolak{background:#fcd2d2}.st.menunggu{background:#fff1c9}
.mc{position:relative;overflow:hidden;border-radius:24px;padding:18px 20px;margin:14px 0;color:#fff;background:linear-gradient(135deg,#0B563F 0%,#12754F 55%,#2a9a6c 100%);box-shadow:0 14px 30px rgba(11,86,63,.28);isolation:isolate}
.mc.pr{background:linear-gradient(135deg,#0B563F 0%,#12754F 40%,#9a7a2e 100%)}
.mc::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.2) 48%,transparent 60%);transform:translateX(-130%);animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.mc>*{position:relative;z-index:2}
.mc-bg{position:absolute!important;z-index:0!important;right:-26px;bottom:-34px;width:190px;animation:flo 7s ease-in-out infinite}
@keyframes flo{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mc-brand{display:flex;align-items:center;gap:8px;font:800 12px var(--font-display);letter-spacing:1.5px;text-transform:uppercase}.mc-brand img{height:30px;background:#fff;border-radius:9px;padding:3px}
.mc-tier{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font:800 12px var(--font-display);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35)}
.mc.pr .mc-tier{background:linear-gradient(90deg,#C59E49,#f1d58b);color:#0B563F;border-color:#f1d58b}
.mc-name{font:800 22px var(--font-display);margin-top:22px}.mc-wa{opacity:.8;letter-spacing:2px;font-size:14px}
.mc-bot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px}.mc-bot small{display:block;opacity:.75;letter-spacing:2px;font-size:11px}.mc-pts{font:800 34px var(--font-display);line-height:1}
.mc-perk{background:rgba(255,255,255,.16);border-radius:12px;padding:6px 12px;font-weight:600;font-size:14px}
.spk{position:absolute!important;z-index:1!important;animation:twk 2.8s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.mc::after,.mc-bg,.spk{animation:none}}

.jm-header{position:relative;color:var(--jm-cream);
  padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 66px;
  background:
    radial-gradient(120% 90% at 100% 0%,#23986B 0%,transparent 55%),
    linear-gradient(165deg,var(--jm-green-700) 0%,var(--jm-green-900) 100%);
  isolation:isolate;overflow:hidden}
/* lengkung bawah = gagang tas, tempat pencarian "duduk" */
.jm-header::after{content:"";position:absolute;left:-6%;right:-6%;bottom:-1px;height:34px;
  background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0;z-index:-1}
.jm-ghost{position:absolute;right:-34px;bottom:6px;width:190px;height:auto;fill:#fff;opacity:.07;transform:rotate(9deg);z-index:-2;pointer-events:none}
.jm-arc{position:absolute;right:-20px;top:-34px;width:210px;height:150px;z-index:-1;pointer-events:none}
.jm-arc path{fill:none;stroke:var(--jm-gold);stroke-width:3;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:0;opacity:.9}
@media (prefers-reduced-motion:no-preference){
  .jm-arc path{animation:jm-draw 1.4s .15s cubic-bezier(.3,.7,.2,1) both}
  @keyframes jm-draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
}
.jm-top{display:flex;align-items:center;gap:12px}
.jm-badge{flex:none;width:46px;height:46px;border-radius:15px;background:var(--jm-cream);display:grid;place-items:center;box-shadow:0 6px 16px rgba(4,36,25,.35)}
.jm-badge svg{width:25px;height:33px}
.jm-who{flex:1;min-width:0;line-height:1.15}
.jm-who small{display:block;font-size:13px;font-weight:500;color:rgba(243,248,244,.78)}
.jm-who strong{display:block;font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jm-actions{display:flex;gap:10px}
.jm-btn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid rgba(243,248,244,.28);background:rgba(255,255,255,.1);
  color:var(--jm-cream);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px)}
.jm-btn:focus-visible,.jm-go:focus-visible{outline:3px solid var(--jm-gold);outline-offset:2px}
.jm-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.jm-count{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--jm-gold);color:#2B1F05;font:700 11px/19px var(--font-body);text-align:center}
.jm-headline{margin:26px 0 0;font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.08;letter-spacing:-.02em;max-width:11em}
.jm-sub{margin:8px 0 0;font-size:14.5px;color:rgba(243,248,244,.8)}
.jm-status{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:6px 12px 6px 10px;border-radius:99px;background:rgba(4,36,25,.32);font-size:12.5px;font-weight:600}
.jm-dot{width:8px;height:8px;border-radius:50%;background:#5BE0A0;box-shadow:0 0 0 0 rgba(91,224,160,.6)}
.jm-status.is-closed .jm-dot{background:var(--jm-gold);box-shadow:none}
@media (prefers-reduced-motion:no-preference){
  .jm-status:not(.is-closed) .jm-dot{animation:jm-pulse 2.2s infinite}
  @keyframes jm-pulse{70%{box-shadow:0 0 0 7px rgba(91,224,160,0)}100%{box-shadow:0 0 0 0 rgba(91,224,160,0)}}
}
.jm-search{position:relative;z-index:2;margin:-30px 20px 0;display:flex;align-items:center;gap:8px;height:58px;padding:0 7px 0 18px;
  background:var(--surface);border:1.5px solid var(--line);border-radius:20px;box-shadow:0 10px 24px -8px rgba(10,88,64,.35)}
.jm-search input{flex:1;min-width:0;border:0;outline:0;background:none;font:500 16px var(--font-body);color:var(--jm-ink)}
.jm-search input::placeholder{color:var(--muted)}
.jm-search:focus-within{border-color:var(--jm-green-700)}
.jm-go{flex:none;width:44px;height:44px;border:0;border-radius:14px;background:var(--jm-gold);color:#2B1F05;display:grid;place-items:center;cursor:pointer}
.jm-go svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){
  .jm-ghost{animation:jm-float 9s ease-in-out infinite}
  @keyframes jm-float{0%,100%{transform:translateY(0) rotate(9deg)}50%{transform:translateY(-9px) rotate(5deg)}}
  .jm-badge{animation:jm-pop .6s .05s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes jm-pop{from{transform:scale(.4) rotate(-12deg);opacity:0}}
  .jm-rise{animation:jm-rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
  .jm-search{animation:jm-rise .7s .55s cubic-bezier(.2,.8,.2,1) both}
  @keyframes jm-rise{from{opacity:0;transform:translateY(14px)}}
  .jm-count.bump{animation:jm-bump .45s cubic-bezier(.3,1.8,.5,1)}
  @keyframes jm-bump{40%{transform:scale(1.5)}}
}/* ==SPLASH CSS START== */
.is-loading{overflow:hidden}
.is-loading .jm-badge,.is-loading .jm-rise,.is-loading .jm-search,.is-loading .jm-arc path{animation-play-state:paused}
.jm-splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--jm-cream);
  padding:env(safe-area-inset-top,0px) 24px env(safe-area-inset-bottom,0px);
  background:radial-gradient(90% 60% at 50% 36%,#23986B 0%,transparent 70%),linear-gradient(165deg,#12754F 0%,#0A5840 100%);
  border-radius:0 0 50% 50%/0 0 9vh 9vh;transition:transform .95s cubic-bezier(.7,0,.2,1);will-change:transform}
.jm-splash.leaving{transform:translateY(-110%)}
.jm-sp-badge{position:relative;width:116px;height:116px;margin-bottom:18px;border-radius:36px;background:var(--jm-cream);display:grid;place-items:center;box-shadow:0 18px 40px rgba(4,36,25,.45)}
.jm-sp-badge::before{content:"";position:absolute;inset:-14px;border-radius:46px;border:1.5px solid rgba(243,248,244,.35)}
.jm-sp-badge svg{width:54px;height:71px;overflow:visible}
.jm-sp-word{margin:0;font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.32em;text-indent:.32em}
.jm-sp-text{margin:0;font-size:13px;color:rgba(243,248,244,.75)}
.jm-sp-track{width:132px;height:4px;margin-top:10px;border-radius:4px;background:rgba(4,36,25,.4);overflow:hidden}
.jm-sp-bar{height:100%;width:0;border-radius:4px;background:var(--jm-gold);transition:width .25s linear}
@media (prefers-reduced-motion:reduce){.jm-splash{transition:opacity .3s}.jm-splash.leaving{transform:none;opacity:0}}
@media (prefers-reduced-motion:no-preference){
  .jm-sp-badge{animation:l-pop .6s .05s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes l-pop{from{transform:scale(.5);opacity:0}}
  .jm-sp-badge::before{animation:l-ring 2.2s 1s ease-out infinite}
  @keyframes l-ring{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.25);opacity:0}}
  .l-body{transform-box:fill-box;transform-origin:50% 100%;animation:l-grow .7s .35s cubic-bezier(.2,.9,.3,1.3) both}
  @keyframes l-grow{from{transform:scale(.5);opacity:0}}
  .l-side{animation:l-fade .4s .75s both}
  @keyframes l-fade{from{opacity:0}}
  .l-handle{transform-box:fill-box;transform-origin:50% 100%;animation:l-drop .8s .8s cubic-bezier(.3,1.5,.5,1) both,l-sway 3s 1.8s ease-in-out infinite}
  @keyframes l-drop{from{transform:translateY(-26px) rotate(-10deg);opacity:0}}
  @keyframes l-sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
  .jm-sp-word{animation:l-up .7s 1.1s both}
  .jm-sp-text{animation:l-up .7s 1.25s both}
  .jm-sp-track{animation:l-up .5s 1.25s both}
  @keyframes l-up{from{opacity:0;transform:translateY(10px)}}
}

.pgpage [hidden]{display:none!important}.pgpage :focus-visible{outline:3px solid var(--jm-gold);outline-offset:2px}.pgpage .hero{position:relative;color:var(--jm-cream);text-align:center;isolation:isolate;overflow:hidden;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 66px;

const payOpts=()=>{const ms=(setg.payment_methods||"tunai").split(",");if(!ms.includes(pay))pay=ms[0];const L={tunai:ful==="antar"?"💵 Tunai (bayar ke kurir)":"💵 Tunai (bayar di toko)",transfer:"🏦 Transfer bank",qris:"📱 QRIS"};
 return`<b class="hdg" style="font-size:15px">Metode pembayaran</b>${ms.map(m=>`<button type="button" class="opt ${pay===m?"on":""}" data-act="pay" data-id="${m}">${L[m]||m}</button>`).join("")}${pay!=="tunai"&&setg.payment_info?`<p class="hint" style="white-space:pre-line">${esc(setg.payment_info)}</p>`:""}`};
const isPromo=p=>p.promo_price!=null&&+p.promo_price>0&&+p.promo_price<+p.price&&(!p.promo_from||new Date(p.promo_from)<=new Date())&&(!p.promo_until||new Date(p.promo_until)>new Date());
const eff=p=>isPromo(p)?+p.promo_price:+p.price,pctOff=p=>Math.round((1-p.promo_price/p.price)*100);
const unitPrice=i=>{const p=products.find(x=>x.id==i);return p?eff(p):0};
const PCT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.3"/><circle cx="17" cy="17" r="2.3"/></svg>';

const card=p=>{const n=cart[p.id]||0,sale=me&&isPromo(p);return`<div class="pc ${sale?"sale":""}">${sale?`<em class="pct">-${pctOff(p)}%</em>`:""}${ph(p)}<div class="pi"><b>${esc(p.name)}</b><span>${esc(p.unit)}</span><i>${me?rp(eff(p)):"Harga khusus member"}</i>${sale?`<s>${rp(p.price)}</s>`:""}</div>${n?`<div class="qty"><button data-act="dec" data-id="${p.id}" aria-label="Kurangi">−</button><span>${n}</span><button data-act="inc" data-id="${p.id}" aria-label="Tambah">+</button></div>`:`<button class="add" data-act="inc" data-id="${p.id}">Tambah</button>`}</div>`};
const listHtml=()=>{const l=products.filter(p=>(cat==="Semua"||(cat==="__promo"?me&&isPromo(p):p.category===cat))&&p.name.toLowerCase().includes(q));return l.map(card).join("")||`<p class="empty">Produk tidak ditemukan.</p>`};

const topCard=()=>me?memberCard()
 :`<div class="mem"><b>Masuk untuk lihat harga</b><span>Harga dan pemesanan khusus member.</span><div style="margin-top:12px"><button class="add" data-act="login">Masuk</button><button class="add" data-act="reg" style="background:#fff;color:var(--green)">Daftar</button></div></div>`;
function homeView(){const cats=["Semua",...new Set(products.map(p=>p.category).filter(Boolean))];
const pn=me?products.filter(isPromo).length:0;if(cat==="__promo"&&!pn)cat="Semua";
const pb=pn?`<button class="cat promo ${cat==="__promo"?"on":""}" data-act="cat" data-id="__promo">${PCT}Diskon<i>${pn}</i></button>`:"";
const bar=cat==="__promo"?`<div class="sale-bar">${FLAME}<span id="saleLbl">Harga diskon khusus member</span><b id="saleCd"></b></div>`:"";
return`${me?"":topCard()}
<div class="chips">${cats.map((c,i)=>`<button class="cat ${c===cat?"on":""}" data-act="cat" data-id="${esc(c)}">${esc(c)}</button>`+(i===0?pb:"")).join("")}</div>${bar}<div id="list">${listHtml()}</div>`}

  else if(a==="apply"){const r=await sb.rpc("apply_prioritas");msg=r.error?r.error.message:"";await load()}
  else if(a==="pay"){pay=id}
  else if(a==="again"){const o=orders.find(x=>x.id==id);o.items.forEach(i=>{if(products.some(p=>p.id==i.id))cart[i.id]=(cart[i.id]||0)+i.qty});cartOpen=true;tab="home"}
  else if(a==="logout"){await sb.auth.signOut();cardAnimated=false;cart={};msg="";tab="home";await load()}
  else if(a==="order"){
    const items=Object.entries(cart).map(([i,qty])=>({id:+i,qty})),addr=ful==="antar"?$("#addr").value.trim():"";
    if(!items.length||(ful==="antar"&&!addr)){msg=!items.length?"Pilih produk dulu.":"Isi alamat pengantaran.";return render()}
    if(busy)return;busy=true;const{error}=await sb.rpc("place_order",{p_items:items,p_fulfillment:ful,p_payment:pay,p_address:addr,p_note:$("#note").value.trim()});
    busy=false;if(error){msg=error.message;return render()}
    if(addr)try{localStorage.setItem("addr",addr)}catch{}
    cart={};cartOpen=false;tab="orders";msg="";await load();
  }
  render();
});
root.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value.toLowerCase();$("#list").innerHTML=listHtml()}});
root.addEventListener("submit",async e=>{e.preventDefault();const k=e.target.dataset.form,f=Object.fromEntries(new FormData(e.target));msg="";
  if(k==="login"){const{error}=await sb.auth.signInWithPassword({email:normWa(f.wa)+"@member.toko",password:f.pw});if(error)msg="Nomor WhatsApp atau kata sandi salah.";else authOpen=false}
  if(k==="reg"){const wa=normWa(f.wa);
    const v=await sb.rpc("code_valid",{p_code:f.code,p_wa:wa});
    if(!v.data)msg="Kode salah, sudah dipakai, atau bukan untuk nomor ini. Minta kode ke admin.";
    else{const{error}=await sb.auth.signUp({email:wa+"@member.toko",password:f.pw,options:{data:{name:f.name,wa}}});
      if(error)msg=/registered/i.test(error.message)?"Nomor ini sudah terdaftar. Silakan masuk.":error.message;
      else{await sb.rpc("claim_code",{p_code:f.code});authOpen=false}}}
  if(k==="gate"){const r=await sb.rpc("claim_code",{p_code:f.code});if(r.error)msg="Kode salah atau sudah dipakai. Minta kode ke admin."}
  await load();render();
});
(async()=>{await load();if(!me)tab="home";render();startType();cfg.onReady&&cfg.onReady();setTimeout(()=>root.classList.add("jm-still"),3600)})();
}

document.body.insertAdjacentHTML("afterbegin",jmSplashHtml());
cfg.onReady=JMSplash(document.getElementById("jmSplash"),document.getElementById("app")).ready;
MemberApp(sb,document.getElementById("app"),cfg);
</script></body></html>
