<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Janah Mart</title><link rel="icon" href="ikon-janah-mart.png"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--dark:#0B563F;--green:#12754F;--gold:#C59E49;--bg:#F3F7F3;--ink:#12261D;--mut:#566A5E;--line:#D8E3DA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Source Sans 3',system-ui,sans-serif}
.app{padding-bottom:96px;min-height:100%}
h1,h2,.hd,.h{font-family:Montserrat,sans-serif;font-weight:800}
h2{font-size:22px;margin:14px 0 10px}
.wrap{max-width:560px;margin:0 auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top img{display:block}
.hi small{color:var(--mut);display:block}.hi b{font:800 20px Montserrat,sans-serif}
.ask{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center;margin:14px 0}
.ic{background:var(--green);width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.ask b{font:800 18px Montserrat,sans-serif;display:block}.ask span{color:var(--mut)}
.mem{background:var(--dark);color:#fff;border-radius:20px;padding:18px;margin:14px 0}
.mem b{font:800 20px Montserrat,sans-serif;display:block}.mem>span{color:#bcd9ca}
.pill{display:inline-block;border:2px solid #3a8a6c;border-radius:999px;padding:3px 14px;margin:10px 8px 0 0;font:700 13px Montserrat,sans-serif;color:#fff}
.pill.on{background:var(--gold);border-color:var(--gold);color:var(--dark)}
input,textarea{width:100%;padding:13px;margin:6px 0;border:2px solid var(--line);border-radius:14px;font:inherit;color:var(--ink);background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px 0 12px}
.chip{flex:none;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;font:600 14px 'Source Sans 3',sans-serif}
.chip.on{background:var(--dark);border-color:var(--dark);color:#fff}
.pc,.oc{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.oc{display:block}.oh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.em{font-size:34px}.pi{flex:1}.pi b{display:block}.pi span{color:var(--mut);font-size:14px}.pi i{display:block;font:800 15px Montserrat,sans-serif;font-style:normal;color:var(--green)}
.add,.btn{background:var(--green);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:700 14px Montserrat,sans-serif}
.btn{width:100%;padding:14px;font-size:16px;margin-top:8px}
.qty{display:flex;align-items:center;background:var(--dark);color:#fff;border-radius:12px}.qty button{background:none;border:0;color:#fff;font-size:22px;width:38px;height:38px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:11px 14px;margin:6px 0;font:600 15px 'Source Sans 3',sans-serif}
.opt.on{border-color:var(--green);background:#e8f3ed}.opt.off{opacity:.55}
.st{border-radius:999px;padding:2px 12px;font:700 12px Montserrat,sans-serif;background:#fff1c9}.st.selesai{background:#c8f2d6}.st.batal{background:#fcd2d2}.st.diantar,.st.diproses,.st.siap{background:#d4ebe0}
.link{background:none;border:0;color:var(--green);font:600 15px 'Source Sans 3',sans-serif;padding:6px 0}
.msg{color:#b3261e;min-height:22px}.empty{color:var(--mut);text-align:center;padding:30px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--mut);font:600 13px 'Source Sans 3',sans-serif;display:grid;gap:2px;justify-items:center}nav button.on{color:var(--green)}
nav .fab{background:var(--gold);color:var(--dark);width:60px;height:60px;border-radius:20px;font:800 24px Montserrat,sans-serif;margin-top:-26px;box-shadow:0 6px 18px rgba(197,158,73,.45);display:block}
.sheet{position:fixed;inset:0;background:rgba(11,86,63,.5);z-index:9;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.auth{max-width:400px;margin:0 auto;padding:40px 20px}.auth h1{font-size:28px;margin:10px 0}
.hint{color:var(--mut);font-size:14px;margin:4px 0}.hint a{color:var(--green)}.mem .add{margin-right:8px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style></head><body><div id="app"></div>
<script>
// === PENGATURAN ===
const cfg={brand:"Janah Mart",logo:"logo-janah-mart.png",icon:"ikon-janah-mart.png",wa:"6283866646900"};
const sb=supabase.createClient("https://rnccjoyomjexqhxxcqbi.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuY2Nqb3lvbWpleHFoeHhjcWJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxODA5NTAsImV4cCI6MjEwODc1Njk1MH0.Mqe5eST4tKgQsZCBr24KwwpikvQJJNX-GCEym4oribY");
function MemberApp(sb,root,cfg){
const $=s=>root.querySelector(s),rp=n=>"Rp"+Number(n).toLocaleString("id-ID");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const normWa=v=>{v=v.replace(/\D/g,"");return v.startsWith("0")?"62"+v.slice(1):v};
let me=null,products=[],orders=[],cart={},tab="home",cat="Semua",q="",mode="login",msg="",cartOpen=false,authOpen=false,ful="ambil",setg={};
root.classList.add("app");

async function load(){
  const{data:{user}}=await sb.auth.getUser();me=null;
  if(user){const{data}=await sb.from("profiles").select("*").eq("id",user.id).single();me=data}
  if(me?.status==="active"){
    const[a,b,c]=await Promise.all([sb.from("products").select("*").eq("active",true).order("category").order("name"),
      sb.from("orders").select("*").order("created_at",{ascending:false}).limit(50),sb.from("settings").select("*")]);
    products=a.data||[];orders=b.data||[];setg=Object.fromEntries((c.data||[]).map(r=>[r.key,r.value]));
  }else if(!me){
    const{data}=await sb.from("public_products").select("*").order("category").order("name");
    products=data||[];orders=[];cart={};
  }
}
const greet=()=>{const h=new Date().getHours();return h<11?"Selamat pagi":h<15?"Selamat siang":h<18?"Selamat sore":"Selamat malam"};
const level=()=>me.tier==="prioritas"?"Prioritas":"Premium";
const stl=s=>s==="siap"?"siap diambil":s;
const logo=()=>cfg.logo?`<img src="${esc(cfg.logo)}" alt="${esc(cfg.brand)}" style="height:46px">`:`<b class="hd">${esc(cfg.brand)}</b>`;
const fulOpts=()=>`<b class="hd" style="font-size:15px">Pengambilan</b><button type="button" class="opt ${ful==="ambil"?"on":""}" data-act="ful" data-id="ambil">🏪 Ambil di toko</button><button type="button" class="opt ${ful==="antar"?"on":""} ${me.tier==="prioritas"?"":"off"}" data-act="ful" data-id="antar">🛵 Antar ke alamat${me.tier==="prioritas"?"":" (khusus Prioritas)"}</button>`;
const card=p=>{const n=cart[p.id]||0;return`<div class="pc"><div class="em">${esc(p.emoji||"🛒")}</div><div class="pi"><b>${esc(p.name)}</b><span>${esc(p.unit)}</span><i>${me?rp(p.price):"Harga khusus member"}</i></div>${n?`<div class="qty"><button data-act="dec" data-id="${p.id}" aria-label="Kurangi">−</button><span>${n}</span><button data-act="inc" data-id="${p.id}" aria-label="Tambah">+</button></div>`:`<button class="add" data-act="inc" data-id="${p.id}">Tambah</button>`}</div>`};
const listHtml=()=>{const l=products.filter(p=>(cat==="Semua"||p.category===cat)&&p.name.toLowerCase().includes(q));return l.map(card).join("")||`<p class="empty">Produk tidak ditemukan.</p>`};

const topCard=()=>me?`<div class="mem"><b>Member ${esc(level())}</b><span>Kumpulkan poin dari setiap belanja.</span><div><span class="pill on">${me.points} poin</span><span class="pill">${me.tier==="prioritas"?"Bisa diantar":"Ambil di toko"}</span></div></div>`
 :`<div class="mem"><b>Masuk untuk lihat harga</b><span>Harga dan pemesanan khusus member.</span><div style="margin-top:12px"><button class="add" data-act="login">Masuk</button><button class="add" data-act="reg" style="background:#fff;color:var(--green)">Daftar</button></div></div>`;
function homeView(){const cats=["Semua",...new Set(products.map(p=>p.category).filter(Boolean))];
return`<div class="ask"><div class="ic">🛒</div><div><b>Mau belanja apa?</b><span>Cari dan pilih kebutuhan dapur</span></div></div>${topCard()}
<input id="q" placeholder="Cari produk…" value="${esc(q)}"><div class="chips">${cats.map(c=>`<button class="chip ${c===cat?"on":""}" data-act="cat" data-id="${esc(c)}">${esc(c)}</button>`).join("")}</div><div id="list">${listHtml()}</div>`}
const ordersView=()=>`<h2>Orderan</h2>`+(orders.map(o=>`<div class="oc"><div class="oh"><b>#${o.id}</b><span class="st ${o.status}">${stl(o.status)}</span></div><small>${new Date(o.created_at).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"})} · ${o.fulfillment==="antar"?"Diantar":"Ambil di toko"}</small><p>${o.items.map(i=>`${esc(i.name)} ×${i.qty}`).join(", ")}</p><div class="oh"><b>${rp(o.total)}</b><button class="link" data-act="again" data-id="${o.id}">Pesan lagi</button></div></div>`).join("")||`<p class="empty">Belum ada pesanan.</p>`);
const contactView=()=>`<h2>Kontak</h2><div class="oc"><p>Ada yang ingin ditanyakan? Hubungi toko lewat WhatsApp.</p><a href="https://wa.me/${esc(cfg.wa)}" target="_blank" rel="noopener"><button class="btn">Chat WhatsApp</button></a></div>`;
const prio=()=>{if(me.tier==="prioritas")return`<div class="oc"><b>Prioritas aktif</b><p>Pesanan Anda bisa diantar ke alamat.</p></div>`;
 const m=setg.prioritas_mode;
 const body=me.apply_status==="diajukan"?`<p>Pengajuan Anda sedang ditinjau admin.</p>`:me.apply_status==="ditolak"?`<p>Pengajuan belum bisa disetujui saat ini. Hubungi admin untuk info.</p>`:m==="ajukan"?`<p>Ajukan Prioritas agar pesanan bisa diantar.</p><button class="btn" data-act="apply">Ajukan Prioritas</button>`:`<p>Prioritas diberikan toko kepada pelanggan setia. Hubungi admin untuk info.</p>`;
 return`<div class="oc"><b>Layanan antar (Prioritas)</b>${body}<p class="msg">${esc(msg)}</p></div>`};
const profileView=()=>`<h2>Profil</h2><div class="oc"><b>${esc(me.name)}</b><p>WhatsApp: ${esc(me.wa)}<br>Member ${esc(level())} · ${me.points} poin</p></div>${prio()}<button class="btn" data-act="logout">Keluar</button>`;

function cartSheet(){const ids=Object.keys(cart);const total=ids.reduce((s,i)=>s+cart[i]*(products.find(p=>p.id==i)?.price||0),0);
let addr="";try{addr=localStorage.getItem("addr")||""}catch{}
return`<div class="sheet" data-act="closecart"><div><h2>Keranjang</h2>${ids.map(i=>{const p=products.find(x=>x.id==i);return p?card(p):""}).join("")||`<p class="empty">Keranjang masih kosong.</p>`}
<b class="h" style="font-size:24px">Total ${rp(total)}</b>${fulOpts()}${ful==="antar"?`<textarea id="addr" rows="2" placeholder="Alamat pengantaran">${esc(addr)}</textarea>`:""}<input id="note" placeholder="Catatan (opsional)"><p class="msg">${esc(msg)}</p><button class="btn" data-act="order">Kirim pesanan</button><button class="link" data-act="closecart">Tutup</button></div></div>`}
function authSheet(){const r=mode==="reg";return`<div class="sheet" data-act="closeauth"><div>${logo()}<h2>${r?"Daftar member":"Masuk"}</h2><p style="color:var(--mut);margin:0">Harga dan pemesanan khusus member.</p>
<form data-form="${mode}">${r?`<input name="name" placeholder="Nama lengkap" required>`:""}<input name="wa" inputmode="tel" placeholder="Nomor WhatsApp" required><input name="pw" type="password" placeholder="${r?"Buat kata sandi (min. 6)":"Kata sandi"}" minlength="6" required>${r?`<input name="code" placeholder="Kode member 8 huruf" maxlength="8" style="text-transform:uppercase" required>`:""}<button class="btn">${r?"Daftar":"Masuk"}</button></form>
<p class="msg">${esc(msg)}</p>${r?`<p class="hint">Belum punya kode? <a href="https://wa.me/${esc(cfg.wa)}" target="_blank" rel="noopener">Minta kode ke admin</a></p>`:""}<button class="link" data-act="${r?"login":"reg"}">${r?"Sudah punya akun? Masuk":"Belum punya akun? Daftar"}</button><button class="link" data-act="closeauth">Tutup</button></div></div>`}
const gateView=()=>`<div class="auth">${logo()}${me.status==="blocked"?`<h1>Akun diblokir</h1><p>Hubungi admin toko untuk bantuan.</p>`:`<h1>Masukkan kode</h1><p>Akun Anda belum aktif. Masukkan kode member 8 huruf dari admin.</p><form data-form="gate"><input name="code" placeholder="Kode member" maxlength="8" style="text-transform:uppercase" required><button class="btn">Aktifkan</button></form><p class="msg">${esc(msg)}</p>`}<button class="link" data-act="logout">Keluar</button></div>`;

function mainView(){const t={home:homeView,orders:ordersView,contact:contactView,profile:profileView}[tab]();const n=Object.values(cart).reduce((a,b)=>a+b,0);
const top=me?`<div class="top"><div style="display:flex;gap:12px;align-items:center">${cfg.icon?`<img src="${esc(cfg.icon)}" alt="" style="height:44px">`:""}<div class="hi"><small>${greet()}</small><b>${esc(me.name)}</b></div></div></div>`:`<div class="top">${logo()}</div>`;
const nb=(k,i,l)=>`<button class="${tab===k?"on":""}" data-act="tab" data-id="${k}"><span style="font-size:22px">${i}</span>${l}</button>`;
return`<div class="wrap">${top}${t}</div><nav>${nb("home","🏠","Beranda")}${nb("orders","🧾","Orderan")}<button class="fab" data-act="cart" aria-label="Keranjang">${n||"+"}</button>${nb("contact","💬","Kontak")}${nb("profile","👤","Profil")}</nav>${me&&cartOpen?cartSheet():""}${!me&&authOpen?authSheet():""}`}
function render(){root.innerHTML=me&&me.status!=="active"?gateView():mainView()}

root.addEventListener("click",async e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if((a==="closecart"||a==="closeauth")&&e.target!==b)return;
  if(!me&&(["inc","dec","cart","again","order"].includes(a)||(a==="tab"&&id!=="home"))){authOpen=true;msg="";return render()}
  if(a==="login"||a==="reg"){mode=a;authOpen=true;msg=""}
  else if(a==="closeauth"){authOpen=false}
  else if(a==="tab"){tab=id;msg="";if(me)await load()}
  else if(a==="cat"){cat=id}
  else if(a==="inc"){cart[id]=Math.min(99,(cart[id]||0)+1)}
  else if(a==="dec"){cart[id]=(cart[id]||0)-1;if(cart[id]<=0)delete cart[id]}
  else if(a==="cart"){cartOpen=true;msg=""}
  else if(a==="closecart"){cartOpen=false}
  else if(a==="ful"){if(id==="antar"&&me.tier!=="prioritas")msg="Pengantaran khusus member Prioritas. Pesanan ini bisa diambil di toko.";else{ful=id;msg=""}}
  else if(a==="apply"){const r=await sb.rpc("apply_prioritas");msg=r.error?r.error.message:"";await load()}
  else if(a==="again"){const o=orders.find(x=>x.id==id);o.items.forEach(i=>{if(products.some(p=>p.id==i.id))cart[i.id]=(cart[i.id]||0)+i.qty});cartOpen=true;tab="home"}
  else if(a==="logout"){await sb.auth.signOut();cart={};msg="";tab="home";await load()}
  else if(a==="order"){
    const items=Object.entries(cart).map(([i,qty])=>({id:+i,qty})),addr=ful==="antar"?$("#addr").value.trim():"";
    if(!items.length||(ful==="antar"&&!addr)){msg=!items.length?"Pilih produk dulu.":"Isi alamat pengantaran.";return render()}
    const{error}=await sb.rpc("place_order",{p_items:items,p_fulfillment:ful,p_address:addr,p_note:$("#note").value.trim()});
    if(error){msg=error.message;return render()}
    if(addr)try{localStorage.setItem("addr",addr)}catch{}
    cart={};cartOpen=false;tab="orders";msg="";await load();
  }
  render();
});
root.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value.toLowerCase();$("#list").innerHTML=listHtml()}});
root.addEventListener("submit",async e=>{e.preventDefault();const k=e.target.dataset.form,f=Object.fromEntries(new FormData(e.target));msg="";
  if(k==="login"){const{error}=await sb.auth.signInWithPassword({email:normWa(f.wa)+"@member.toko",password:f.pw});if(error)msg="Nomor WhatsApp atau kata sandi salah.";else authOpen=false}
  if(k==="reg"){const wa=normWa(f.wa);
    const v=await sb.rpc("code_valid",{p_code:f.code,p_wa:wa});
    if(!v.data)msg="Kode salah, sudah dipakai, atau bukan untuk nomor ini. Minta kode ke admin.";
    else{const{error}=await sb.auth.signUp({email:wa+"@member.toko",password:f.pw,options:{data:{name:f.name,wa}}});
      if(error)msg=/registered/i.test(error.message)?"Nomor ini sudah terdaftar. Silakan masuk.":error.message;
      else{await sb.rpc("claim_code",{p_code:f.code});authOpen=false}}}
  if(k==="gate"){const r=await sb.rpc("claim_code",{p_code:f.code});if(r.error)msg="Kode salah atau sudah dipakai. Minta kode ke admin."}
  await load();render();
});
(async()=>{await load();render()})();
}

MemberApp(sb,document.getElementById("app"),cfg);
</script></body></html>
